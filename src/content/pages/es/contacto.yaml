title: "Contacto: agenda una llamada · AuraNova"
description: "Agenda una llamada para platicar de tu sitio web, o escríbenos. Atendemos de lunes a viernes, de 9:00 a 17:00."

hero:
  eyebrow: "Contacto"
  title: "Agenda una ==llamada=="
  lead: "Una llamada de {{duracionLlamada}} para conocer tu negocio y lo que necesitas de tu sitio."
  or: "o"
  emailCta: "Envíanos un correo"
  hours: "Atendemos {{horario}}."
  bookingPending: "[[PENDIENTE: liga de Cal.com para agendar (Q16)]]"
  next:
    title: "Qué pasa después"
    steps:
      - title: "Eliges día y hora"
        text: "Ves los horarios disponibles en tu propia zona horaria."
      - title: "Recibes la confirmación"
        text: "Te llega un correo con la liga de la llamada."
      - title: "Platicamos"
        text: "Revisamos tu objetivo, el alcance y los tiempos. Después te enviamos una propuesta por escrito."

form:
  eyebrow: "Formulario"
  title: "¿Prefieres ==escribirnos==?"
  lead: "Cuéntanos de tu proyecto y te respondemos en {{respuesta}}."
  optional: "(opcional)"
  select: "Elige una opción"
  fields:
    name: "Nombre"
    email: "Correo"
    company: "Empresa"
    website: "Sitio actual"
    websiteHint: "Si ya tienes uno."
    type: "¿Qué necesitas?"
    # value = HubSpot's servicio_de_interes and worker/lead.ts SERVICES (the build fails if one is unknown).
    typeOptions:
      - { value: "sitio_web", label: "Sitio web nuevo, rediseño o tienda" }
      - { value: "plataforma", label: "Plataforma a la medida" }
      - { value: "posicionamiento", label: "Posicionamiento en Google" }
      - { value: "contenido_marca", label: "Contenido y marca" }
      - { value: "mantenimiento", label: "Mantenimiento y soporte" }
      - { value: "asesoria", label: "Asesoría digital" }
      - { value: "no_seguro", label: "No estoy seguro" }
    budget: "Presupuesto aproximado"
    budgetHint: "Montos en pesos mexicanos, más IVA."
    budgetNone: "Prefiero no decir"
    budgetOptions:  # Q6 ✅ (David, 2026-10-21, with the pricing); the same ranges as the call guide's notes sheet
      - "Menos de $20,000"
      - "$20,000 a $35,000"
      - "$35,000 a $50,000"
      - "Más de $50,000"
    message: "Mensaje"
    messageHint: "¿Qué quieres lograr con tu sitio?"
    consent: "Leí y acepto el [aviso de privacidad](/aviso-de-privacidad/)."
    # Secondary purpose (aviso §3.2): its own optional box, unchecked by default.
    newsletter: "Quiero recibir novedades, contenido y promociones de AuraNova por correo. Puedes darte de baja cuando quieras."
  # Aviso de privacidad simplificado (the draft's wording; the lawyer confirms it).
  notice: "AuraNova, nombre comercial de {{nombreLegal}}, usa tus datos para responder tu solicitud, hacer el diagnóstico de tu sitio si lo pides, agendar tu llamada y, si contratas, prestar el servicio y facturarlo. Con tu consentimiento, también los usa para enviarte novedades y medir sus anuncios; puedes negarte a esto último sin que afecte tu solicitud. Consulta el [aviso de privacidad integral](/aviso-de-privacidad/)."
  submit: "Enviar mensaje"
  sending: "Enviando…"
  noscript: "Para enviar el formulario necesitas JavaScript. También puedes escribirnos a contacto@auranova.mx."
  status:
    sent: "Recibimos tu mensaje. Te respondemos en {{respuesta}} y te enviamos una confirmación a tu correo."
    # When Turnstile shows its checkbox (it asks only when it can't confirm silently).
    verify: "Para enviar tu mensaje, completa la verificación de arriba."
    challenge: "No pudimos confirmar que eres una persona. Inténtalo de nuevo."
    failed: "No pudimos enviar tu mensaje. Inténtalo de nuevo en unos minutos o escríbenos a contacto@auranova.mx."
  errors:
    required: "Este campo es obligatorio."
    email: "Escribe un correo válido, por ejemplo nombre@empresa.com."
    consent: "Necesitamos tu consentimiento para poder responderte."
    summary: "Revisa los campos marcados."

channels:
  eyebrow: "Otros canales"
  title: "También por ==correo=="
  labels:
    email: "Correo"
    hours: "Horario"
    response: "Respuesta"
  response: "En {{respuesta}}"
  # Stands alone, so it uses the footer's wording (no leading "de"; audit L5).
  hours: "{{horarioPie}}"
