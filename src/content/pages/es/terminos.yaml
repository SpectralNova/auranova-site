title: "Términos de uso · AuraNova"
description: "Las reglas para usar el sitio de AuraNova: qué puedes hacer en él, de quién es su contenido y qué ley aplica."

hero:
  eyebrow: "Términos de uso"
  title: "Términos de uso del ==sitio=="
  lead: "Estos términos explican las reglas para usar el sitio web de AuraNova. Te pedimos leerlos: al usar el sitio, los aceptas."
  updated: "Última actualización: 21 de octubre de 2026"
  review: "[[PENDIENTE: revisión de los términos de uso por un abogado, antes de publicarlos]]"

sections:
  - id: quien
    nav: "Quién opera el sitio"
    title: "1. Quién opera este sitio"
    body:
      - "El sitio web auranova.mx (el «sitio») lo opera {{nombreLegal}}, persona física con actividad empresarial en México, bajo el nombre comercial AuraNova (en adelante, «AuraNova» o «nosotros»)."
      - "**Domicilio:** {{domicilio}}."
      - "**Correo de contacto:** [contacto@auranova.mx](mailto:contacto@auranova.mx)"
      - "El sitio está dirigido a negocios y a personas mayores de edad."

  - id: alcance
    nav: "Qué regulan"
    title: "2. Qué regulan estos términos"
    body:
      - "Estos términos regulan el uso del sitio: navegar en él, leer y compartir su contenido, agendar una llamada o escribirnos por el formulario."
      - "**No regulan los proyectos que nos contratas.** El alcance, el precio, los tiempos, los pagos y la propiedad de cada proyecto se acuerdan por escrito en su propuesta y en el contrato que firmamos contigo. Si algo de este sitio difiere de lo que dicen la propuesta o el contrato, valen la propuesta y el contrato."
      - "El tratamiento de tus datos personales se rige por nuestro [Aviso de privacidad](/aviso-de-privacidad/)."
      - "Al usar el sitio aceptas estos términos. Si no estás de acuerdo con ellos, te pedimos no usarlo."

  - id: informacion
    nav: "La información del sitio"
    title: "3. La información del sitio"
    body:
      - "La información del sitio es general y orientativa. Describe nuestros servicios y nuestra forma de trabajar, pero no es una cotización ni una oferta vinculante: el precio y el alcance de tu proyecto los fija su propuesta por escrito."
      - "Los resultados que mostramos, como las calificaciones de velocidad y accesibilidad, son mediciones reales en la fecha que indicamos y pueden cambiar con el tiempo. Los resultados de un proyecto no garantizan los mismos resultados en otro, y no prometemos resultados que no dependen sólo de nosotros, como posiciones en Google o un número de ventas."
      - "Hacemos nuestro mejor esfuerzo para que la información esté completa y al día, pero puede contener errores u omisiones. Si encuentras uno, te agradecemos avisarnos."

  - id: uso
    nav: "Cómo usar el sitio"
    title: "4. Cómo puedes usar el sitio"
    body:
      - h: "4.1 Puedes"
      - list:
          - "Navegar en el sitio y leer su contenido."
          - "Compartir ligas a sus páginas."
          - "Agendar una llamada o escribirnos por el formulario o por correo."
          - "Descargar los materiales gratuitos que publiquemos, para tu uso o el de tu negocio."
      - h: "4.2 No puedes"
      - list:
          - "Usar el sitio para fines ilícitos o que dañen a otras personas."
          - "Copiar, reproducir o vender el contenido, el diseño o el código del sitio, ni usarlos en otro sitio, sin nuestra autorización por escrito."
          - "Intentar vulnerar la seguridad del sitio, de sus formularios o de nuestros proveedores, ni interferir con su funcionamiento, por ejemplo con envíos automatizados o un volumen de solicitudes que lo sature."
          - "Introducir virus o cualquier código malicioso."
          - "Recolectar datos del sitio con programas automatizados, salvo los buscadores para indexarlo."
          - "Suplantar a otra persona o darnos datos falsos en el formulario."
          - "Usar el formulario para enviar publicidad o mensajes no solicitados."
      - "Si incumples estos términos, podemos bloquear tu acceso al sitio, sin perjuicio de las acciones legales que correspondan."

  - id: propiedad
    nav: "Propiedad intelectual"
    title: "5. Propiedad intelectual"
    body:
      - "Los textos, el diseño, las ilustraciones, el código, el logotipo y la marca AuraNova, y el resto del contenido del sitio son de AuraNova o de sus respectivos titulares, y están protegidos por las leyes mexicanas de derechos de autor y de propiedad industrial."
      - "Usar el sitio no te transmite ningún derecho sobre ese contenido. Te damos permiso para verlo y compartir sus ligas con fines personales e informativos, no comerciales."
      - "Las capturas y los datos de los proyectos de nuestros clientes son de ellos y los mostramos con su autorización. Las marcas y logotipos de las herramientas que mencionamos, como Astro, WordPress o Cloudflare, son de sus respectivos dueños y aparecen sólo para identificar las herramientas que usamos; no implican patrocinio ni asociación."
      - "Los derechos sobre los sitios que hacemos para nuestros clientes se rigen por su contrato, no por estos términos."

  - id: terceros
    nav: "Servicios de terceros"
    title: "6. Enlaces y servicios de terceros"
    body:
      - "El sitio enlaza a servicios de terceros, como la agenda de llamadas (Cal.com), las videollamadas (Zoom) y los sitios de nuestros clientes. Cada uno tiene sus propios términos y aviso de privacidad. No controlamos su contenido ni sus prácticas, y no somos responsables de ellos."
      - "Para protegerlo del spam, el formulario usa Cloudflare Turnstile, que puede pedirte una verificación."

  - id: responsabilidad
    nav: "Responsabilidad"
    title: "7. Responsabilidad"
    body:
      - "Trabajamos para que el sitio funcione bien, sea rápido y seguro, pero no podemos garantizar que esté disponible siempre, sin interrupciones ni errores, ni que funcione en cualquier dispositivo o navegador."
      - "En la medida en que la ley lo permita, AuraNova no es responsable de los daños que resulten del uso del sitio o de la imposibilidad de usarlo, ni de decisiones que tomes sólo con base en su información general, sin la propuesta por escrito de tu proyecto."
      - "Nada de lo anterior limita los derechos que la Ley Federal de Protección al Consumidor te reconoce."

  - id: cambios
    nav: "Cambios"
    title: "8. Cambios al sitio y a estos términos"
    body:
      - "Podemos actualizar, cambiar o retirar el contenido y las funciones del sitio en cualquier momento."
      - "También podemos cambiar estos términos. Publicamos la versión nueva en esta página, con su fecha de actualización, y entra en vigor desde su publicación. Si sigues usando el sitio después, aceptas la versión nueva."

  - id: ley
    nav: "Ley aplicable"
    title: "9. Ley aplicable y desacuerdos"
    body:
      - "Estos términos se rigen por las leyes federales de los Estados Unidos Mexicanos, entre ellas el Código Civil Federal, el Código de Comercio, la Ley Federal de Protección al Consumidor, la Ley Federal de Protección de Datos Personales en Posesión de los Particulares, la Ley Federal del Derecho de Autor y la Ley Federal de Protección a la Propiedad Industrial."
      - "Si surge un desacuerdo, primero buscaremos resolverlo contigo de buena fe y por escrito. Si no lo logramos, nos sometemos a los tribunales competentes de Monterrey, Nuevo León [[CONFIRMAR: tribunales de Monterrey, N.L. (Q3)]], sin perjuicio de tu derecho a acudir a la Procuraduría Federal del Consumidor (PROFECO)."

  - id: finales
    nav: "Disposiciones finales"
    title: "10. Disposiciones finales"
    body:
      - "Si una parte de estos términos resulta inválida, el resto sigue vigente."

contact:
  title: "¿Tienes preguntas sobre estos términos?"
  body:
    - "Escríbenos a [contacto@auranova.mx](mailto:contacto@auranova.mx)."
    - "Consulta también nuestro [Aviso de privacidad](/aviso-de-privacidad/)."
