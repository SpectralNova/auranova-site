order: 4
route: "servicios/contenido-y-marca"
name: "Contenido y marca"
kicker: "Textos, imágenes y video"
navIcon: "sparkles"
art: "contenido"
summary: "Textos que venden, imágenes y video para tu sitio y tus redes, y una identidad visual que se ve como una sola marca."

page:
  title: "Contenido, video e identidad visual · AuraNova"
  description: "Textos para tu sitio, imágenes a tu medida, video y reels, subtítulos, identidad visual y presentaciones para pequeños y medianos negocios."
  hero:
    eyebrow: "Contenido y marca"
    title: "Contenido que ==habla por tu negocio=="
    lead: "Escribimos los textos de tu sitio, creamos imágenes y video para tu sitio y tus redes, y ordenamos tu identidad visual para que todo se vea como una sola marca."

  # Signature demo (src/components/demos/DemoContenido.astro). Illustrative reel.
  demo:
    eyebrow: "En acción"
    title: "Tu contenido, ==en producción=="
    lead: "Editamos tu video, escribimos los subtítulos y diseñamos las portadas con los colores de tu marca. Así se ve un reel mientras lo armamos."
    ui:
      file: "reel_lanzamiento"
      formats: ["9:16", "1:1", "16:9"]
      captions: ["Pasteles para cada ocasión", "Hechos a mano, todos los días", "Pide el tuyo hoy"]
      times: ["00:03", "00:08", "00:13"]
      total: "00:15"
      tracks: ["Video", "Gráficos", "Subtítulos", "Música"]
      ruler: ["00:00", "00:05", "00:10", "00:15"]
      thumbsTitle: "Portadas"
      paletteTitle: "Tu marca"

  capabilities:
    eyebrow: "Lo que hacemos"
    title: "Todo lo que ==se ve y se lee=="
    items:
      - { icon: "pen-line", title: "Textos para tu sitio", text: "En español claro, con las palabras que usan tus clientes, y pensados para que te contacten." }
      - { icon: "image", title: "Imágenes personalizadas para ti", text: "¿Ya tienes imágenes de tu negocio? Las revisamos y las complementamos con nuestro diseño. ¿No tienes? Nosotros nos encargamos con modelos avanzados de inteligencia artificial, sin que parezcan imágenes genéricas o mal generadas." }
      - { icon: "clapperboard", title: "Video y reels", text: "Edición de video para redes: cortes, gráficos animados, música y color." }
      - { icon: "captions", title: "Subtítulos", text: "Subtítulos precisos y limpios para que tus videos se entiendan sin sonido." }
      - { icon: "image-play", title: "Miniaturas y portadas", text: "Portadas para YouTube, reels y publicaciones que invitan a dar clic." }
      - { icon: "swatch-book", title: "Identidad visual", text: "Paleta de colores, tipografías, logotipo listo para web y una guía sencilla de uso." }
      - { icon: "presentation", title: "Presentaciones y documentos", text: "Presentaciones, propuestas y documentos con tu marca, listos para enviar." }

  # Tools grid, in two groups (labels in pages/es/servicios.yaml → tools.items).
  toolsTitle: "Las herramientas que usamos para darle vida a ==tu visión=="
  toolGroups:
    - title: "Edición y diseño"
      slugs: ["premierepro", "aftereffects", "photoshop", "illustrator"]
    - title: "Modelos para crear imágenes"
      slugs: ["nanobanana", "imagen", "gptimage", "flux", "seedream", "ideogram", "recraft", "kling", "grok", "qwenimage", "wan", "hunyuan", "luma", "metamuse", "reve", "imagineart", "krea", "zimage"]

  includes:
    eyebrow: "Qué incluye"
    title: "Contenido a la medida, ==con tu voz=="
    lead: "Cotizamos cada pieza o paquete por separado, según lo que necesites."
    columns:
      - title: "Incluye"
        list:
          - "Una propuesta de tono y estilo antes de producir"
          - "Las piezas acordadas, en los formatos que necesitas"
          - "Una ronda de revisión por entrega"
          - "Archivos finales a tu nombre"
      - title: "Tú aportas"
        list:
          - "Información de tu negocio y de tus clientes"
          - "El material de video que grabes, si es video"
          - "Tu logo y tus colores, si ya los tienes"
      - title: "No incluye"
        negative: true
        list:
          - "Sesiones de fotografía o grabación en sitio"
          - "Administración diaria de tus redes sociales"
          - "Pauta publicitaria"

  faq:
    eyebrow: "Preguntas frecuentes"
    title: "Dudas sobre ==contenido=="
    items:
      - q: "¿Puedo usar las imágenes en mi negocio?"
        a: "Sí. Las imágenes que creamos para ti tienen licencia comercial: puedes usarlas en tu sitio, en tus redes sociales, en anuncios pagados, en podcasts e incluso en televisión. Las revisamos antes de entregarlas y nunca las presentamos como fotos reales de tu negocio."
      - q: "¿Ustedes graban el video?"
        a: "Trabajamos con el material que nos compartes y lo convertimos en piezas listas para publicar. Si necesitas grabación, lo platicamos."
      - q: "¿Puedo pedir sólo una parte?"
        a: "Sí. Puedes pedir sólo textos, sólo video o sólo tu identidad visual."

  cta:
    title: "¿Tu marca necesita ==verse como una sola==?"
    text: "Agenda una llamada de {{duracionLlamada}} y te decimos por dónde empezar."
