page:
  title: "Diseño de páginas web para negocios · AuraNova"
  description: "Sitios web nuevos, rediseños, landing pages y tiendas en línea para pequeños y medianos negocios. Rápidos, claros y tuyos desde el primer día."
  hero:
    eyebrow: "Sitios web"
    title: "Sitios web hechos para ==que te contacten=="
    lead: "Sitios nuevos, rediseños, landing pages y tiendas en línea para pequeños y medianos negocios. Rápidos en el celular, fáciles de actualizar y tuyos desde el primer día."

  # Signature demo (src/components/demos/DemoSitios.astro). Illustrative: a generic "Tu negocio".
  demo:
    eyebrow: "En acción"
    title: "Del código a ==tu sitio en línea=="
    lead: "Construimos tu sitio pieza por pieza, con código limpio, y lo ves crecer en una vista previa real antes de publicarlo."
    ui:
      file: "inicio.astro"
      url: "tunegocio.mx"
      brand: "Tu negocio"
      headline: "Pasteles para cada ocasión"
      button: "Cotiza ahora"
      send: "Enviar"
      published: "Publicado"

  # "Este sitio, medido": real numbers from src/data/site-scores.json (npm run measure).
  quality:
    eyebrow: "Calidad medida"
    title: "Este sitio, ==medido=="
    lead: "Antes de publicar, medimos tu sitio con Lighthouse, la herramienta de Google para revisar sitios web, como parte de nuestro estándar de calidad. Éstos son los resultados del sitio que estás viendo, medido en celular."
    reportTitle: "Reporte de este sitio"
    lcpLabel: "El contenido principal aparece en"
    caption: "Lighthouse en modo celular; mostramos la calificación más baja de las páginas medidas."
    items:
      - { title: "Rendimiento", text: "Qué tan rápido carga y responde, sobre todo en el celular." }
      - { title: "Accesibilidad", text: "Que cualquier persona lo pueda usar, también con teclado o con lector de pantalla." }
      - { title: "Buenas prácticas", text: "Conexión segura y código al día." }
      - { title: "SEO", text: "Que Google lo entienda y lo muestre bien." }

  capabilities:
    eyebrow: "Lo que hacemos"
    title: "Todo lo que lleva ==un buen sitio=="
    items:
      - { icon: "layout-template", title: "Sitios informativos", text: "Las páginas que tu negocio necesita: inicio, servicios, nosotros y contacto, cada una con un objetivo claro." }
      - { icon: "mouse-pointer-click", title: "Landing pages", text: "Una página enfocada en una sola acción para tu campaña, promoción o lanzamiento." }
      - { icon: "shopping-bag", title: "Tiendas y catálogos", text: "Catálogos de productos y tiendas en línea con WooCommerce, con pagos y envíos configurados." }
      - { icon: "refresh-cw", title: "Rediseños y migraciones", text: "Renovamos tu sitio o lo pasamos a una plataforma más rápida sin perder lo que ya ganaste en Google." }
      - { icon: "calendar-check", title: "Formularios y citas", text: "Formularios de contacto, cotizaciones y agenda de citas que llegan directo a tu correo." }
      - { icon: "palette", title: "Diseño para tu marca", text: "Un diseño hecho para tu negocio, con tus colores y tu tono, no una plantilla genérica." }
      - { icon: "gauge", title: "Rápido desde el inicio", text: "Carga rápido en cualquier celular y está listo para Google desde el primer día." }
      - { icon: "pencil", title: "Fácil de actualizar", text: "Te dejamos una forma sencilla de cambiar textos, fotos y precios, y te enseñamos a usarla." }
      - { icon: "accessibility", title: "Accesible para todos", text: "Funciona con teclado y lectores de pantalla, para que nadie se quede fuera." }

  includes:
    eyebrow: "Qué incluye"
    title: "Todo por escrito, ==antes de empezar=="
    lead: "Esto incluye normalmente un sitio web; en tu propuesta, el Anexo A lo detalla página por página."
    columns:
      - title: "Incluye"
        list:
          - "Un brief por página: objetivo, público y acción principal"
          - "Vista previa real de tu diseño antes de construir"
          - "Las páginas acordadas en tu Anexo A"
          - "Formulario de contacto con aviso de privacidad"
          - "SEO técnico: títulos, descripciones, mapa del sitio y datos estructurados"
          - "Analítica para medir contactos"
          - "Reporte de nuestro estándar de calidad"
          - "Una ronda de revisión por etapa"
          - "Una sesión de capacitación y {{garantia}} de garantía"
      - title: "Tú aportas"
        list:
          - "Los textos, o la información para escribirlos"
          - "Tu logo y tus fotos"
          - "Accesos a tu dominio y hosting, si ya los tienes"
          - "Una persona que revise y apruebe"
      - title: "No incluye"
        negative: true
        list:
          - "Fotografía o video profesional"
          - "Campañas de anuncios"
          - "El costo del dominio, el hosting y las licencias: van a tu nombre y los pagas directo"

  faq:
    eyebrow: "Preguntas frecuentes"
    title: "Dudas sobre ==tu sitio=="
    items:
      - q: "¿Pueden rediseñar mi sitio actual?"
        a: "Sí. Medimos tu sitio actual, conservamos lo que funciona y cuidamos tus direcciones (URL) para no perder lo que ya ganaste en Google."
      - q: "¿Una tienda en línea es igual de rápida que un sitio?"
        a: "No siempre, y te lo decimos desde el principio. Una tienda en WordPress carga más código que un sitio hecho a la medida: el carrito, el inventario, la pasarela de pago y los plugins que la hacen funcionar. Además, su velocidad depende del hosting que contratas. Por eso, en tiendas fijamos una meta realista (una calificación de 70 o más en celular, en lugar de 90) y te entregamos el reporte con lo que la afecta."
      - q: "¿Podré cambiar los textos yo mismo?"
        a: "Sí. Te dejamos una forma sencilla de editar el contenido y te capacitamos en una sesión."
      - q: "¿Con qué herramientas trabajan?"
        a: "Elegimos la herramienta según tu proyecto. Hemos construido sitios con Astro, Next.js y WordPress."
      - q: "¿El dominio y el hosting están incluidos?"
        a: "Se registran a tu nombre y los pagas directo al proveedor; así siempre son tuyos. Te ayudamos a contratarlos y configurarlos."
      - q: "¿Cuánto tarda?"
        a: "Lo define el alcance de tu proyecto. El calendario se acuerda por escrito en tu propuesta, con una fecha para cada etapa."

  cta:
    title: "¿Listo para un sitio que ==sí trabaje==?"
    text: "Agenda una llamada de {{duracionLlamada}}. Atendemos {{horario}}."
